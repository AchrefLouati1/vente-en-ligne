spring.application.name=vente-en-ligne
server.port=8080

# MySQL (XAMPP : utilisateur root sans mot de passe par défaut)
spring.datasource.url=jdbc:mysql://localhost:3306/vente_en_ligne?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
